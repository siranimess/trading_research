[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-trading-research"
version = "0.1.0"
description = "Multi-agent systematic trading research with Deep Agents and deterministic backtesting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "openai>=2.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
trading-research = "trading_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
